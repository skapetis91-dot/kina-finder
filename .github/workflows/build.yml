name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o "$(ls *.zip | head -1)" -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleRelease --no-daemon
        working-directory: src
      - run: |
          cp src/app/build/outputs/apk/release/app-release.apk KinaFinder.apk
          gh release create "v${{ github.run_number }}" KinaFinder.apk --title "Κίνα Finder v${{ github.run_number }}" --notes "Πάτα KinaFinder.apk για κατέβασμα"
        env:
          GH_TOKEN: ${{ github.token }}
